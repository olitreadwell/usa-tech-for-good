name: "Twin Cities Innovation Alliance"
domain: "tech-ethics / responsible-AI"
what: >-
  Twin Cities Innovation Alliance is a Minneapolis social venture that supports
  entrepreneurs and community leaders from Black, Indigenous and other
  marginalized communities. It runs initiatives on ethical AI, data transparency
  and algorithmic justice, including the NOTICE Coalition against youth
  surveillance in schools.
