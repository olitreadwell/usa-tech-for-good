name: "Air Alliance Houston"
domain: "green / climate-tech"
what: >-
  Air Alliance Houston is a non-profit advocacy organization working to reduce
  the public health impacts of air pollution and advance environmental justice
  in Houston. It runs AirMail, a system that scans state air permit applications
  and notifies nearby residents, and publishes air monitoring and pollution data.
