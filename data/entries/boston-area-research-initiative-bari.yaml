name: Boston Area Research Initiative (BARI)
domain: civic-tech
what: >-
  The Boston Area Research Initiative is a research center at Northeastern
  University that uses civic data and community research partnerships to study
  social, economic and environmental issues in Greater Boston. It runs the
  Boston Data Portal and convenes researchers, public agencies and community
  groups.
