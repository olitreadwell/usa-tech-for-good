what: >-
  Awana Digital is a non-profit that works with Indigenous and frontline
  communities to build technology for defending land, culture and human rights.
  Its tools include CoMapeo for territory monitoring and mapping, Terrastories
  for place-based storytelling and the Earth Defenders Toolkit.
