name: "Community Data Science Collective"
domain: "research / education tech"
what: >-
  The Community Data Science Collective is an interdisciplinary research group
  of faculty and students at several US universities who study online
  communities and collaborative production. Its members use quantitative and
  qualitative methods to examine how communication and information technologies
  shape participation and public goods.
