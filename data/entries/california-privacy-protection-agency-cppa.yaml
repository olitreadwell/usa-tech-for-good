name: California Privacy Protection Agency (CPPA)
domain: govtech
what: >-
  The California Privacy Protection Agency is the state agency that implements
  and enforces California's consumer privacy law. It operates the Delete Request
  and Opt-out Platform and a data broker registry, and educates the public about
  privacy rights.
